[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
ffi = false
fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "../frontend/lib/" }
]
gas_limit = 300000000
bytecode_hash = "none"
allow_internal_expect_revert = true

[profile.default.fuzz]
runs = 64

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
